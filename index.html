  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event ON — AI 기반 행사 기획 및 공간 설계 플랫폼</title>
    <meta
      name="description"
      content="생성형 AI 및 3D 디지털 트윈 기반 행사 자동 설계, 군중 동선 시뮬레이션, 돌발상황 대응, 포용적 접근성(어린이·고령자·휠체어·유모차·외국인) 분석 및 설명 가능한 AI(XAI) 플랫폼"
    />
    <meta property="og:title" content="Event ON — AI 기반 행사 기획 및 공간 설계 플랫폼" />
    <meta
      property="og:description"
      content="행사 기획부터 3D 공간 배치, 운영 분석, AI 보고서까지 한곳에서 관리하는 Event ON 워크스페이스"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event && event.reason && event.reason.message ? String(event.reason.message) : '';
        if (msg.indexOf('WebSocket closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
